name: Fetch gas price
# Descarca istoricul TTF si il ataseaza release-ului data-latest (gas_ttf.csv). Doar manual.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests
      - run: python scripts/fetch_gas.py
      - run: gh release upload data-latest gas_ttf.csv --clobber
