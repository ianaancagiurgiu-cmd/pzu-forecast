name: Import weather history
# O singura data: incarca istoricul de vreme (weather_*.csv din release) si productia reala in DB, apoi reantreneaza
# modelul cu variabilele de vreme (o rulare completa, cu recalibrare). Doar manual.
on: workflow_dispatch
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: scripts/ci_db.sh pull
      - name: Descarca istoricul de vreme
        run: |
          for g in ro centru vest; do gh release download data-latest -p "weather_$g.csv" --clobber; done
      - name: Importa vremea
        run: python scripts/import_weather.py weather_ro.csv weather_centru.csv weather_vest.csv
      - name: Productia reala solara/eoliana (24 de luni)
        run: python scripts/backfill_production.py --months 24
      - name: Reantreneaza modelul cu vreme
        run: python -m pzu.pipeline retrain
      - name: Actualizeaza baza de date si dashboard-ul
        if: always() && hashFiles('pzu.db') != ''
        run: |
          python scripts/export_static.py || true
          scripts/ci_db.sh push site/dashboard.html
