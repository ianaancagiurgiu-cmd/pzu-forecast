name: Backfill regiune (o singura data)
# Descarca preturile pietelor din regiune (AT, DE, CZ, HR, SI, GR) si prognoza de consum a vecinilor pentru 24 de luni,
# in paralel (~10 minute), apoi reantreneaza modelul. Ruleaza manual dupa ce codul e pe main: Actions -> Run workflow.
on:
  workflow_dispatch:
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: scripts/ci_db.sh pull
      - name: Descarca regiunea (procese paralele)
        run: |
          pids=()
          for z in AT DE CZ HR SI GR; do python scripts/backfill_region.py --prices $z --loads "" & pids+=($!); done
          for z in HU BG RS SK; do python scripts/backfill_region.py --prices "" --loads $z & pids+=($!); done
          for p in "${pids[@]}"; do wait "$p"; done
      - name: Reantreneaza cu variabilele noi
        run: python -m pzu.pipeline retrain
      - run: scripts/ci_db.sh push
