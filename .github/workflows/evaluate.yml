name: Evaluate forecast
# Dupa publicarea rezultatelor oficiale PZU (~13:00 CET). Idempotent, cu mai multe incercari.
on:
  schedule:
    - cron: "41 11,12,13 * * *"
    - cron: "17 15 * * *"     # ultima incercare
  workflow_dispatch:
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Descarca baza de date
        run: scripts/ci_db.sh pull
      - name: Compara forecast cu preturile oficiale
        id: job
        env:
          FINAL: ${{ github.event.schedule == '17 15 * * *' && '--final' || '' }}
        run: python -m pzu.pipeline evaluate $FINAL
      - name: Actualizeaza baza de date si dashboard-ul
        if: always() && hashFiles('pzu.db') != ''
        run: |
          python scripts/export_static.py || true
          scripts/ci_db.sh push site/dashboard.html
