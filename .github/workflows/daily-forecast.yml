name: Daily forecast
# Orele sunt in UTC: 03:00/04:00 UTC = 06:00 ora Romaniei (vara/iarna). Job-ul e idempotent:
# ruleaza de mai multe ori pe dimineata (datele D+1 pot aparea mai tarziu) si sare peste daca exista deja forecast.
on:
  schedule:
    - cron: "0 3,4,6 * * *"
    - cron: "30 8 * * *"      # ultima incercare (10:30-11:30 ora Romaniei, inainte de gate closure 12:00 CET)
  workflow_dispatch:
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Descarca baza de date
        run: scripts/ci_db.sh pull
      - name: Forecast D+1
        id: job
        env:
          FINAL: ${{ github.event.schedule == '30 8 * * *' && '--final' || '' }}
        run: python -m pzu.pipeline daily $FINAL
      - name: Actualizeaza baza de date si dashboard-ul
        if: always() && hashFiles('pzu.db') != ''
        run: |
          python scripts/export_static.py || true
          scripts/ci_db.sh push site/dashboard.html
