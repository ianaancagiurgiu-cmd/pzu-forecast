name: Daily forecast
# Orele sunt in UTC (06:00 ora Romaniei = 03:00 vara / 04:00 iarna). GitHub intarzie sau omite rulari programate,
# mai ales la minutele rotunde (:00, :30), deci avem multe incercari la minute neobisnuite. Job-ul e idempotent:
# sare peste daca forecast-ul exista deja (rulare de ~1 minut) si reincearca daca datele D+1 nu sunt inca publicate.
on:
  schedule:
    - cron: "7 3,4,5,6,7,8 * * *"
    - cron: "37 4,5,6,7,8 * * *"
    - cron: "53 8 * * *"      # ultima incercare, inainte de gate closure (12:00 CET = 10:00 UTC vara, 11:00 UTC iarna)
  workflow_dispatch:
    inputs:
      force:
        description: "Regenereaza forecast-ul chiar daca exista deja pentru ziua urmatoare"
        type: boolean
        default: false
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Descarca baza de date
        run: scripts/ci_db.sh pull
      - name: Forecast D+1
        id: job
        env:
          FINAL: ${{ github.event.schedule == '53 8 * * *' && '--final' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m pzu.pipeline daily $FINAL $FORCE
      - name: Actualizeaza baza de date si dashboard-ul
        if: always() && hashFiles('pzu.db') != ''
        run: |
          python scripts/export_static.py || true
          scripts/ci_db.sh push site/dashboard.html
