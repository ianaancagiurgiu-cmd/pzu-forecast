name: Daily forecast
# Orele sunt in UTC (06:00 ora Romaniei = 03:00 vara / 04:00 iarna). GitHub intarzie sau omite rulari programate,
# mai ales la minutele rotunde (:00, :30), deci avem multe incercari la minute neobisnuite. Job-ul e idempotent:
# sare peste daca forecast-ul exista deja si datele sunt neschimbate, il actualizeaza daca s-au schimbat (pana la
# 13:00 ora Romaniei) si reincearca daca datele D+1 nu sunt inca publicate. Fiecare versiune se pastreaza in DB.
on:
  schedule:
    - cron: "7 3,4,5,6,7,8 * * *"
    - cron: "37 4,5,6,7,8 * * *"
    - cron: "53 8 * * *"      # ultima incercare pentru prima prognoza, inainte de gate closure
    # Actualizari aproape de inchiderea pietei (13:00 ora Romaniei = 10:00 UTC vara, 11:00 UTC iarna). Regenereaza
    # prognoza doar daca datele s-au schimbat si doar inainte de 13:00 ora Romaniei (altfel ies imediat).
    - cron: "23 9 * * *"
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenereaza forecast-ul chiar daca exista deja pentru ziua urmatoare"
        type: boolean
        default: false
      alert:
        description: "Deschide o alerta (issue) daca prognoza pentru maine lipseste dupa rulare"
        type: boolean
        default: false
concurrency: { group: pzu-db, cancel-in-progress: false }
permissions:
  contents: write
  issues: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: sqlite:///pzu.db
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Descarca baza de date
        run: scripts/ci_db.sh pull
      - name: Forecast D+1
        id: job
        env:
          FINAL: ${{ github.event.schedule == '53 8 * * *' && '--final' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m pzu.pipeline daily $FINAL $FORCE
      - name: Alerta daca prognoza lipseste
        # la cerere (alert=true) si la rularile programate de dinaintea inchiderii pietei (11:23 si 12:23 ora Romaniei, iarna)
        if: always() && (inputs.alert || github.event.schedule == '23 9 * * *' || github.event.schedule == '23 10 * * *') && hashFiles('pzu.db') != ''
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          msg=$(python -m pzu.pipeline check); code=$?
          echo "$msg"
          open=$(gh issue list --state open --search "Prognoza lipseste in:title" --json number -q '.[].number')
          if [ $code -eq 3 ]; then
            if [ -z "$open" ]; then
              gh issue create --title "Prognoza lipseste: $(TZ=Europe/Bucharest date +%Y-%m-%d\ %H:%M)" \
                --body "$msg la $(TZ=Europe/Bucharest date +%H:%M) (ora Romaniei). Piata se inchide la 13:00. Vezi rularea: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
          elif [ $code -eq 0 ]; then
            for n in $open; do gh issue close "$n" --comment "$msg (rezolvat automat)."; done
          fi
          exit 0
      - name: Actualizeaza baza de date si dashboard-ul
        if: always() && hashFiles('pzu.db') != ''
        run: |
          python scripts/export_static.py || true
          scripts/ci_db.sh push site/dashboard.html
