services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pzu
      POSTGRES_PASSWORD: pzu
      POSTGRES_DB: pzu
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://pzu:pzu@db:5432/pzu
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
